apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "env-portal.fullname" . }}-migrate
  labels:
    {{- include "env-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Runs before the new pods roll out, so they never see an older schema.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "env-portal.selectorLabels" (dict "root" $ "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "env-portal.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "env-portal.image" (dict "root" $ "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["alembic", "upgrade", "head"]
          env:
            - name: PORTAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database-url
          securityContext:
            {{- include "env-portal.containerSecurityContext" . | nindent 12 }}
