{{- $component := dict "root" $ "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "env-portal.fullname" . }}-api
  labels:
    {{- include "env-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "env-portal.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "env-portal.selectorLabels" $component | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "env-portal.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "env-portal.image" $component }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "env-portal.backendEnv" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "env-portal.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "env-portal.fullname" . }}-api
  labels:
    {{- include "env-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "env-portal.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "env-portal.fullname" . }}-api
  labels:
    {{- include "env-portal.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "env-portal.selectorLabels" $component | nindent 6 }}
